plugins {
    id "com.android.application" version "8.7.3"
    id "org.jetbrains.kotlin.android" version "2.1.10"
    id "org.jetbrains.kotlin.plugin.allopen" version "2.1.10"
    id "com.google.devtools.ksp" version "2.1.10-1.0.31" apply false
    id "org.jetbrains.kotlin.kapt" version "2.1.10" apply false
}

def aaProcessor = (findProperty("aa.processor") ?: "ksp").toString()
def useKsp = aaProcessor == "ksp"

if (useKsp) {
    apply plugin: "com.google.devtools.ksp"
} else {
    apply plugin: "org.jetbrains.kotlin.kapt"
}

android {
    namespace "org.androidannotations.gradle"
    compileSdk 35

    defaultConfig {
        applicationId "org.androidannotations.gradle.bench"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0-SNAPSHOT"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    buildFeatures {
        buildConfig false
    }
}

allOpen {
    annotation("org.androidannotations.api.KotlinOpen")
}

def AAVersion = "4.9.0-SNAPSHOT"

dependencies {
    implementation "org.androidannotations:androidannotations-api:$AAVersion"
    if (useKsp) {
        ksp "org.androidannotations:androidannotations-ksp:$AAVersion"
    } else {
        kapt "org.androidannotations:androidannotations:$AAVersion"
    }
}

if (useKsp) {
    ksp {
        arg("resourcePackageName", "org.androidannotations.gradle")
    }
} else {
    kapt {
        arguments {
            arg("resourcePackageName", "org.androidannotations.gradle")
            arg("androidManifestFile", "$projectDir/src/main/AndroidManifest.xml")
        }
        correctErrorTypes = true
    }
}

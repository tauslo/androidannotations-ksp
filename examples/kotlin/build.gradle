plugins {
    id "com.android.application" version "8.7.3"
    id "org.jetbrains.kotlin.android" version "2.1.10"
    id "org.jetbrains.kotlin.plugin.allopen" version "2.1.10"
    id "com.google.devtools.ksp" version "2.1.10-1.0.31"
}

android {
    namespace "org.androidannotations.gradle"
    compileSdk 35

    defaultConfig {
        applicationId "org.androidannotations.gradle"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0-SNAPSHOT"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    buildFeatures {
        buildConfig false
    }
}

allOpen {
    annotation("org.androidannotations.api.KotlinOpen")
}

// AndroidAnnotations KSP options (names aligned with the APT options):
//   resourcePackageName - package holding the R class (default: manifest application package)
//   androidManifestFile - explicit path to AndroidManifest.xml (relative paths resolve against the
//                         Gradle working directory; default: probe upward from the working dir,
//                         preferring build/intermediates/merged_manifests over src/main)
//   library             - "true" relaxes @E* component registration validation (library modules)
//   classSuffix         - suffix of generated classes (default "_")
//   useR2               - "true" references R2 instead of R
ksp {
    arg("resourcePackageName", "org.androidannotations.gradle")
}

def AAVersion = "4.9.0-SNAPSHOT"

dependencies {
    ksp "org.androidannotations:androidannotations-ksp:$AAVersion"
    implementation "org.androidannotations:androidannotations-api:$AAVersion"
}
